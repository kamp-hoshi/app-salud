<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b131e"/>
      <stop offset="50%" stop-color="#05080c"/>
      <stop offset="100%" stop-color="#020406"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield / Hexagon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Tactical Grid Marks -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#0f172a" stroke-width="1.5"/>

  <!-- F1 Pit Crew Checkered Accents -->
  <g opacity="0.15">
    <rect x="70" y="70" width="16" height="16" fill="#00ff9d"/>
    <rect x="86" y="86" width="16" height="16" fill="#00ff9d"/>
    <rect x="102" y="70" width="16" height="16" fill="#00ff9d"/>
    <rect x="426" y="426" width="16" height="16" fill="#00ff9d"/>
    <rect x="410" y="410" width="16" height="16" fill="#00ff9d"/>
    <rect x="394" y="426" width="16" height="16" fill="#00ff9d"/>
  </g>

  <!-- Gauge Arc Ring (Energy & Pacing) -->
  <path d="M 120 340 A 160 160 0 1 1 392 340" fill="none" stroke="#1e293b" stroke-width="22" stroke-linecap="round"/>
  <path d="M 120 340 A 160 160 0 1 1 330 140" fill="none" stroke="url(#neonGreen)" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Traffic Light Indicators (F1 Pacing System) -->
  <circle cx="160" cy="180" r="10" fill="#00ff9d" filter="url(#glow)"/>
  <circle cx="256" cy="130" r="10" fill="#fbbf24"/>
  <circle cx="352" cy="180" r="10" fill="#ff4b4b"/>

  <!-- Center Telemetry EKG / Heart Pulse + Battery Wave -->
  <path d="M 140 270 L 195 270 L 220 220 L 245 320 L 275 190 L 305 310 L 325 270 L 372 270" 
        fill="none" stroke="url(#neonGreen)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Pit Crew Fuel / Battery / Bolt Symbol -->
  <path d="M 256 320 L 272 360 L 250 360 L 262 400 L 240 355 L 260 355 Z" fill="#00ff9d" filter="url(#glow)"/>

  <!-- HUD Corner Markers -->
  <path d="M 90 130 L 90 90 L 130 90" fill="none" stroke="#00ff9d" stroke-width="4" stroke-linecap="round"/>
  <path d="M 422 130 L 422 90 L 382 90" fill="none" stroke="#00ff9d" stroke-width="4" stroke-linecap="round"/>
  <path d="M 90 382 L 90 422 L 130 422" fill="none" stroke="#00ff9d" stroke-width="4" stroke-linecap="round"/>
  <path d="M 422 382 L 422 422 L 382 422" fill="none" stroke="#00ff9d" stroke-width="4" stroke-linecap="round"/>
</svg>
